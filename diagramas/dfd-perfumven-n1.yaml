tipo: dfd
titulo: Perfumven — Distribuidora de cosméticos y perfumería
nivel: 1
nota: >-
  Nivel 1. Corregido respecto del borrador: la "necesidad de compra" no viaja
  de P2 a P3 como flujo directo (en nivel 1 no se permiten flujos entre
  procesos); P3 monitorea el inventario y decide la compra. Si se explotara al
  nivel 2, el flujo directo entre subprocesos sí sería válido.
