tipo: organigrama
titulo: Mafalda S.A. — Artefactos de baño, mamparas y pisos cerámicos
disposicion: vertical
esSA: true
nota: >-
  Enunciado de la U3. Por ser S.A. se agregan AGA y Directorio (regla de la
  cátedra), aunque el texto solo detalla desde la Gerencia General. La Oficina
  de Seguridad depende jerárquicamente de Sistemas y tiene supervisión directa
  del Gerente General: se representa con línea de dependencia funcional.
  Los departamentos Mayorista y Minorista están departamentalizados por área
  geográfica.
